project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - data/*.csv

website:
  site-url: "https://phpstats.github.io/phibble/"
  title: "phibble"
  repo-url: "https://github.com/phpstats/phibble"
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - getting-started.qmd
      - coming-from-tibble.qmd
      - section: "Guides"
        contents:
          - types.qmd
          - io.qmd
          - expr.qmd
          - sql.qmd
          - laravel.qmd
      - section: "Backends"
        contents:
          - backends.qmd
          - contract.qmd
      - development.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    highlight-style: github
