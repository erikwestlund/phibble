name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The SQL tests run against SQLite always, and against these servers
    # through the PHIBBLE_TEST_* DSNs below.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: phibble
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: phibble
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pphibble"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      PHIBBLE_TEST_PGSQL: pgsql:host=127.0.0.1;port=5432;dbname=postgres
      PHIBBLE_TEST_PGSQL_USER: postgres
      PHIBBLE_TEST_PGSQL_PASSWORD: phibble
      PHIBBLE_TEST_MYSQL: mysql:host=127.0.0.1;port=3306
      PHIBBLE_TEST_MYSQL_USER: root
      PHIBBLE_TEST_MYSQL_PASSWORD: phibble

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring
          coverage: none

      - run: composer install --no-interaction --no-progress

      # Without the php-stats extension, the model and native-CSV tests are skipped.
      - run: vendor/bin/pest
